services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # Pre-built chunks/BM25 index, produced locally by the ingestion
      # scripts (python ingestion/chunk.py, python ingestion/bm25_index.py)
      # before bringing this stack up - not baked into the image, see
      # Dockerfile comment.
      - ./data/processed:/app/data/processed
      - ./data/bm25_index.pkl:/app/data/bm25_index.pkl
    depends_on:
      - qdrant

volumes:
  qdrant_storage:

# First run: the qdrant service starts empty. Populate it once with:
#   QDRANT_URL=http://localhost:6333 python ingestion/embed.py
# (run from the host, with the qdrant container's port published as above)
